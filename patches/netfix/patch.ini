; Manifest of the patch "netfix" (see docs/patch-authoring.md and README.md next to this file).
[patch]
id=netfix
name=Network fix
version=0.1.0
kind=patch
api=1
module=netfix.dll
targets=server
enabled=1
order=100
requires=
conflicts=
description=Multiplayer host: messages split by VPN/Internet connections no longer break the session; faster replies.

[builds]
; builds this patch was developed and tested for (ids of builds/*.ini)
server=server-de-2.06

[symbols]
; the patch only hooks imports (recv, accept, closesocket), no game functions
server=

[settings]
; defaults; players override them in e1400patch.ini [netfix]
; 1 = send small messages immediately (TCP_NODELAY on client connections)
tcp_nodelay=1
; longest message (bytes) a client may announce; longer ones would overrun the server's receive buffer
max_message_length=306
