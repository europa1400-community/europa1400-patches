; e1400patch loader configuration. The installer (e1400patch.exe install or the manager) fills [install] and
; [loader] original_server; everything else is optional.

[loader]
; original server.dll, relative to the game directory
;original_server=Server\server.dll
; other locations of the patch and mod folders (relative to the game directory)
;patches_dir=patches
;mods_dir=mods

[patches]
; enable or disable single patches and mods: <id>=1 or <id>=0 (default: the patch's own setting)

; per-patch settings override the [settings] defaults of the patch's manifest:
;[netfix]
;some_setting=1
