[gfxfix]
; Which monitor the game uses: 1 = first adapter (normally the Windows main display), 2 = second, ...
; 0 = off (the game sees all monitors as usual). After a start, gfxfix.log lists the monitors and their numbers.
monitor=1
; pow2caps=1 reports power-of-two texture caps (fixes cut-off interface graphics on modern graphics cards); 0 = off
pow2caps=1
